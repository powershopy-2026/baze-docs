name: Replace production URLs on fat-test

on:
  push:
    branches: [fat-test]

jobs:
  replace-urls:
    runs-on: ubuntu-latest
    # 避免死循环：bot 自己提交的 push 不再触发替换
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Skip if only workflow files changed
        id: check
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          base_sha="$BEFORE_SHA"
          if ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            base_sha="$(git rev-parse HEAD~1)"
          fi
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

          if git diff --quiet "$base_sha"..HEAD -- \
            ':(exclude).github/'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Replace production URLs and sync standalone pages
        if: steps.check.outputs.skip == 'false'
        run: |
          # 替换 OpenAPI JSON 中的 URL（反向）
          find api-reference -name '*.json' -exec \
            sed -i 's|https://api\.powertokens\.ai|https://baze-api.powerbuyin.top|g' {} + 2>/dev/null || true

          # 替换 JSON 文件中不带 -api 前缀的 URL（反向）
          find api-reference -name '*.json' -exec \
            sed -i 's|https://powertokens\.ai|https://baze.powerbuyin.top|g' {} + 2>/dev/null || true

          # 替换 JSON 文件中的环境描述（反向）
          find api-reference -name '*.json' -exec \
            sed -i 's|"description": "生产环境"|"description": "测试环境"|g' {} + 2>/dev/null || true

          # 替换所有文档目录中的 URL（md / mdx）（反向）
          for dir in docs zh-Hans en; do
            find "$dir" -type f \( -name '*.md' -o -name '*.mdx' \) -exec \
              sed -i 's|https://api\.powertokens\.ai|https://baze-api.powerbuyin.top|g' {} + 2>/dev/null || true
          done

          # 替换根目录配置文件中的 URL（反向）
          for f in AGENTS.md docs.json .mintignore; do
            sed -i 's|https://api\.powertokens\.ai|https://baze-api.powerbuyin.top|g' "$f" 2>/dev/null || true
          done

          # 仅为本次新增或更新的 OpenAPI MDX 页面同步 standalone 页面
          git diff --name-only --diff-filter=AM -z \
            "${{ steps.check.outputs.base_sha }}"..HEAD -- en zh-Hans | \
            while IFS= read -r -d '' source; do
              case "$source" in
                en/standalone/*|zh-Hans/standalone/*)
                  continue
                  ;;
                en/*.mdx)
                  lang="en"
                  ;;
                zh-Hans/*.mdx)
                  lang="zh-Hans"
                  ;;
                *)
                  continue
                  ;;
              esac

              if grep -q '^openapi:' "$source"; then
                relative_path="${source#"$lang/"}"
                target="$lang/standalone/$relative_path"
                mkdir -p "$(dirname "$target")"
                cp "$source" "$target"
              fi
            done

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "sync: update test URLs and standalone pages [skip ci]"
            git push origin fat-test
          fi
